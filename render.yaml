# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Fill the "sync: false" secrets when prompted. Database = MongoDB Atlas free M0 (permanent): paste its connection string as MONGODB_URI.
# Free web services sleep when idle.
services:
  - type: web
    name: maha-cyber-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: maha_cyber
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: NEWS_API_KEY
        sync: false

  - type: web
    name: maha-cyber-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BACKEND_URL
        fromService:
          type: web
          name: maha-cyber-api
          property: hostport
      - key: NEXTAUTH_SECRET
        generateValue: true
