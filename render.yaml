# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Fill the "sync: false" secrets when prompted. Free web services sleep when idle.
# The database is an external free Neon Postgres (no expiry): paste its connection string as DATABASE_URL.

services:
  - type: web
    name: maha-cyber-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NEWS_API_KEY
        sync: false

  - type: web
    name: maha-cyber-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BACKEND_URL
        fromService:
          type: web
          name: maha-cyber-api
          property: hostport
      - key: NEXTAUTH_SECRET
        generateValue: true
